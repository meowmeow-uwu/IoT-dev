<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển IoT</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 20px auto; }
        h1 { color: #333; }
        .data { font-size: 24px; font-weight: bold; color: #0066cc; margin: 10px 0; }
        input[type="number"] { width: 140px; padding: 10px; font-size: 16px; margin: 10px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 5px; color: white; transition: 0.3s; }
        .btn-quay { background-color: #007bff; font-weight: bold; width: 80%; }
        .btn-dung { background-color: #dc3545; display: block; width: 80%; margin: 10px auto 0 auto; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .hint { font-size: 12px; color: #666; margin-top: -5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌡️ Thông số Môi trường</h2>
        <div class="data">Nhiệt độ: <span id="temp">--</span> °C</div>
        <div class="data">Độ ẩm: <span id="hum">--</span> %</div>
    </div>

    <div class="card">
        <h2>⚙️ Điều khiển Động cơ</h2>
        <input type="number" id="angle" placeholder="Nhập góc (VD: 90, -90)">
        <div class="hint">(Dương: quay thuận ↻ | Âm: quay nghịch ↺)</div>
        
        <!-- NÚT QUAY DUY NHẤT -->
        <button class="btn-quay" onclick="sendMotorCommand()">🔄 BẮT ĐẦU QUAY</button>
        
        <!-- NÚT DỪNG -->
        <button class="btn-dung" onclick="stopMotor()">🛑 DỪNG ĐỘNG CƠ</button>
        
        <p id="motor-status" style="color: #d84b25; font-size: 15px; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        // Lấy dữ liệu cảm biến
        function fetchSensorData() {
            fetch('/api/sensor')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        document.getElementById('temp').innerText = data.temp;
                        document.getElementById('hum').innerText = data.hum;
                    }
                })
                .catch(error => console.error('Lỗi đọc cảm biến:', error));
        }
        setInterval(fetchSensorData, 3000);
        fetchSensorData();

        // Gửi lệnh quay dựa trên giá trị âm/dương của góc
        function sendMotorCommand() {
            const angleVal = document.getElementById('angle').value;
            const statusText = document.getElementById('motor-status');
            const angle = parseFloat(angleVal);

            if (isNaN(angle) || angle === 0) {
                alert('Vui lòng nhập góc khác 0 (Dương: quay thuận, Âm: quay nghịch)!');
                return;
            }

            statusText.innerText = "Đang gửi lệnh...";

            fetch('/api/motor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ angle: angle })
            })
            .then(response => response.json())
            .then(data => {
                statusText.innerText = data.message;
                statusText.style.color = data.status === 'success' ? "#28a745" : "#dc3545";
            })
            .catch(error => {
                statusText.innerText = "Lỗi kết nối!";
                statusText.style.color = "#dc3545";
            });
        }

        // Gửi lệnh DỪNG
        function stopMotor() {
            const statusText = document.getElementById('motor-status');
            fetch('/api/motor/stop', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                statusText.innerText = data.message;
                statusText.style.color = "#dc3545";
            });
        }
    </script>
</body>
</html>
